<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Catalogue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #bdc3c7; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn-cart { background-color: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-cart:hover { background-color: #219653; }
        .book-img { width: 60px; height: 80px; background-color: #ddd; display: inline-block; text-align: center; line-height: 80px; font-size: 11px; color: #666; }
    </style>
</head>
<body>

    <h2>Book Catalogue</h2>
    <table>
        <thead>
            <tr>
                <th>Cover Page</th>
                <th>Author Name</th>
                <th>Publisher</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><div class="book-img">Cover 1</div></td>
                <td>Robert T. Kiyosaki</td>
                <td>Warner Books</td>
                <td>$15.99</td>
                <td><button class="btn-cart">Add to Cart</button></td>
            </tr>
            <tr>
                <td><div class="book-img">Cover 2</div></td>
                <td>James Clear</td>
                <td>Penguin Random House</td>
                <td>$18.50</td>
                <td><button class="btn-cart">Add to Cart</button></td>
            </tr>
            <tr>
                <td><div class="book-img">Cover 3</div></td>
                <td>J.K. Rowling</td>
                <td>Bloomsbury</td>
                <td>$22.00</td>
                <td><button class="btn-cart">Add to Cart</button></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
