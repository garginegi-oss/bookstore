<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Shopping Cart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #2c3e50; }
        .cart-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cart-table th, .cart-table td { border: 1px solid #bdc3c7; padding: 12px; text-align: left; }
        .cart-table th { background-color: #34495e; color: white; }
        .total-row { font-weight: bold; background-color: #eaeded; }
        .btn-checkout { background-color: #2980b9; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; float: right; margin-top: 15px; font-size: 16px; }
        .btn-checkout:hover { background-color: #2471a3; }
    </style>
</head>
<body>

    <h2>Your Shopping Cart</h2>
    <table class="cart-table">
        <thead>
            <tr>
                <th>Item Description</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Atomic Habits by James Clear</td>
                <td>1</td>
                <td>$18.50</td>
                <td>$18.50</td>
            </tr>
            <tr>
                <td>Rich Dad Poor Dad by Robert Kiyosaki</td>
                <td>2</td>
                <td>$15.99</td>
                <td>$31.98</td>
            </tr>
            <tr class="total-row">
                <td colspan="3" style="text-align: right;">Grand Total:</td>
                <td>$50.48</td>
            </tr>
        </tbody>
    </table>

    <button class="btn-checkout">Proceed to Checkout</button>

</body>
</html>
