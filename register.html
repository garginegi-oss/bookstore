<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f7; padding: 20px; }
        .form-container { max-width: 500px; background: white; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-row { margin-bottom: 15px; }
        .form-row label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-row input[type="text"], .form-row input[type="password"], .form-row textarea, .form-row select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .inline-group { display: flex; gap: 10px; }
        .checkbox-group, .radio-group { display: flex; flex-wrap: wrap; gap: 15px; padding-top: 5px; }
        .btn-submit { background-color: #2c3e50; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #34495e; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registration Form</h2>
    <form id="regForm" onsubmit="return validateForm(event)">
        
        <!-- 1) Name Verification -->
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <div id="nameError" class="error-msg">Name must only contain alphabets and be greater than 6 characters.</div>
        </div>

        <!-- 2) Password Verification -->
        <div class="form-row">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <div id="passError" class="error-msg">Password must be greater than 6 characters long.</div>
        </div>

        <!-- 3) E-mailid Verification -->
        <div class="form-row">
            <label for="email">E-mail ID:</label>
            <input type="text" id="email" name="email">
            <div id="emailError" class="error-msg">Please enter a valid email format (e.g., name@domain.com).</div>
        </div>

        <!-- 4) Phone Number Verification -->
        <div class="form-row">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone">
            <div id="phoneError" class="error-msg">Phone number must contain exactly 10 numeric digits.</div>
        </div>

        <!-- 5) Sex -->
        <div class="form-row">
            <label>Sex:</label>
            <div class="radio-group">
                <label><input type="radio" name="sex" value="male" checked> Male</label>
                <label><input type="radio" name="sex" value="female"> Female</label>
            </div>
        </div>

        <!-- 6) Date of Birth -->
        <div class="form-row">
            <label>Date of Birth:</label>
            <div class="inline-group">
                <select name="dob_day" required><option value="1">1</option><option value="2">2</option></select>
                <select name="dob_month" required><option value="1">January</option></select>
                <select name="dob_year" required><option value="2000">2000</option></select>
            </div>
        </div>

        <!-- 7) Languages Known -->
        <div class="form-row">
            <label>Languages Known:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="languages" value="english"> English</label>
                 <label><input type="checkbox" name="languages" value="hindi"> Hindi</label>
                  <label><input type="checkbox" name="languages" value="tamil"> Tamil</label>
                <label><input type="checkbox" name="languages" value="telugu"> Telugu</label>
            </div>
        </div>

        <!-- 8) Address -->
        <div class="form-row">
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Registration</button>
    </form>
</div>

<script>
function validateForm(event) {
    let isValid = true;
    
    // Reset errors
    document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

    // 1. Name Check (Alphabets only, > 6 chars)
    const name = document.getElementById('name').value;
    const alphaRegex = /^[A-Za-z\s]+$/;
    if (name.length <= 6 || !alphaRegex.test(name)) {
        document.getElementById('nameError').style.display = 'block';
        isValid = false;
    }

    // 2. Password Check (> 6 chars)
    const password = document.getElementById('password').value;
    if (password.length <= 6) {
        document.getElementById('passError').style.display = 'block';
        isValid = false;
    }

    // 3. Email Check (Standard format verification)
    const email = document.getElementById('email').value;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        isValid = false;
    }

    // 4. Phone Check (Exactly 10 numeric digits)
    const phone = document.getElementById('phone').value;
    const phoneRegex = /^\d{10}$/;
    if (!phoneRegex.test(phone)) {
        document.getElementById('phoneError').style.display = 'block';
        isValid = false;
    }

    if (!isValid) {
        event.preventDefault(); // Block submission if invalid
    }
    return isValid;
}
</script>
</body>
</html>
